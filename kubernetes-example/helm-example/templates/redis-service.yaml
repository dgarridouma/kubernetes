apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    app: redis
spec:
  selector:
    app: redis
  type: {{ .Values.redis.service.type }}
  ports:
    - protocol: "TCP"
      port: {{ .Values.redis.service.port }}
      targetPort: {{ .Values.redis.containerPort }}
