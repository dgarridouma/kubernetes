apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
data:
  database.ini: |
    [database]
    host = localhost
    port = 5432
---
apiVersion: v1
kind: Pod
metadata:
  name: mi-pod
spec:
  containers:
    - name: myapp
      image: busybox
      command: ["sleep", "3600"]
      volumeMounts:
        - name: db-config-volume
          mountPath: /etc/app
  volumes:
    - name: db-config-volume
      configMap:
        name: db-config